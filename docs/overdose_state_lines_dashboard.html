<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>State Monthly Overdose Deaths: All-State Trend Lines</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-a: #f5f1e8;
      --bg-b: #e6edf5;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0b6e4f;
      --border: #d1d5db;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #d8ebe5 0%, transparent 45%),
                  linear-gradient(140deg, var(--bg-a), var(--bg-b));
      min-height: 100vh;
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.3rem, 2.4vw, 2rem);
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #374151;
      margin-bottom: 4px;
    }

    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      font-family: inherit;
      font-size: 0.93rem;
      background: #fff;
    }

    select[multiple] {
      min-height: 126px;
      padding: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    button {
      border: 1px solid #bfd6ce;
      background: #edf7f3;
      color: #155e4a;
      border-radius: 999px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button:hover { background: #e4f3ee; }

    .status {
      min-height: 18px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #chart {
      width: 100%;
      min-height: 620px;
    }

    .legend-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr; }
      #chart { min-height: 520px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Monthly Overdose Deaths by State</h1>
    <p class="subtitle">
      All states are always displayed. Use region and/or state dropdowns to highlight selected lines.
    </p>

    <section class="panel">
      <div class="controls">
        <div>
          <label for="variableSelect">Overdose Indicator</label>
          <select id="variableSelect"></select>
        </div>
        <div>
          <label for="regionSelect">Highlight Region(s)</label>
          <select id="regionSelect" multiple></select>
        </div>
        <div>
          <label for="stateSelect">Highlight State(s)</label>
          <select id="stateSelect" multiple></select>
        </div>
      </div>

      <div class="actions">
        <button id="clearHighlightsBtn" type="button">Clear Highlights</button>
        <button id="highlightAllBtn" type="button">Highlight All States</button>
      </div>

      <div id="status" class="status">Loading overdose data...</div>
      <div id="chart"></div>
      <p class="legend-note">Hint: hold <strong>Command</strong> (Mac) or <strong>Ctrl</strong> (Windows) to select multiple items in a dropdown.</p>
    </section>
  </main>

  <script>
    const DATA_FILE = "./state_opioid_overdose_monthly_counts_estimated.csv";

    const REGION_TO_STATES = {
      Northeast: ["CT", "ME", "MA", "NH", "RI", "VT", "NJ", "NY", "PA"],
      Midwest: ["IL", "IN", "MI", "OH", "WI", "IA", "KS", "MN", "MO", "NE", "ND", "SD"],
      South: ["DE", "FL", "GA", "MD", "NC", "SC", "VA", "WV", "AL", "KY", "MS", "TN", "AR", "LA", "OK", "TX"],
      West: ["AZ", "CO", "ID", "MT", "NV", "NM", "UT", "WY", "AK", "CA", "HI", "OR", "WA"]
    };

    const REGION_COLORS = {
      Northeast: "#0f766e",
      Midwest: "#8b5cf6",
      South: "#dc2626",
      West: "#2563eb"
    };

    const STATE_TO_REGION = Object.entries(REGION_TO_STATES).reduce((acc, [region, states]) => {
      states.forEach((s) => { acc[s] = region; });
      return acc;
    }, {});

    const STATE_ABBRS = new Set(Object.keys(STATE_TO_REGION));

    const store = {
      rows: [],
      variables: [],
      stateNameByAbbr: new Map()
    };

    const variableSelect = document.getElementById("variableSelect");
    const regionSelect = document.getElementById("regionSelect");
    const stateSelect = document.getElementById("stateSelect");
    const statusEl = document.getElementById("status");

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function selectedValues(selectEl) {
      return [...selectEl.options].filter((opt) => opt.selected).map((opt) => opt.value);
    }

    function setOptions(selectEl, values, selectedValuesList) {
      const selectedSet = new Set(selectedValuesList || []);
      selectEl.innerHTML = "";
      values.forEach((value) => {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = value;
        opt.selected = selectedSet.has(value);
        selectEl.appendChild(opt);
      });
    }

    function loadData() {
      Papa.parse(DATA_FILE, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: ({ data, errors }) => {
          if (errors.length) {
            setStatus("Failed to parse overdose CSV.");
            return;
          }

          const variableSet = new Set();

          for (const row of data) {
            const stateAbbr = String(row.state_abbr || "").trim().toUpperCase();
            if (!STATE_ABBRS.has(stateAbbr)) continue;

            const dateStr = String(row.date || "").trim();
            const variable = String(row.variable || "").trim();
            const stateName = String(row.state_name || stateAbbr).trim();
            const count = Number(row.count);
            if (!dateStr || !variable || !Number.isFinite(count)) continue;

            const date = new Date(dateStr);
            if (Number.isNaN(date.getTime())) continue;

            variableSet.add(variable);
            store.stateNameByAbbr.set(stateAbbr, stateName);
            store.rows.push({
              stateAbbr,
              stateName,
              region: STATE_TO_REGION[stateAbbr],
              variable,
              date,
              count
            });
          }

          store.variables = [...variableSet].sort((a, b) => a.localeCompare(b));
          if (!store.variables.length || !store.rows.length) {
            setStatus("No valid overdose records found.");
            return;
          }

          setOptions(variableSelect, store.variables, ["Synthetic opioids, excl. methadone (T40.4)"]);
          if (!variableSelect.value) variableSelect.selectedIndex = 0;

          const regions = Object.keys(REGION_TO_STATES);
          setOptions(regionSelect, regions, []);

          const stateLabels = [...store.stateNameByAbbr.entries()]
            .map(([abbr, name]) => ({ abbr, label: `${name} (${abbr})` }))
            .sort((a, b) => a.label.localeCompare(b.label));

          stateSelect.innerHTML = "";
          stateLabels.forEach(({ abbr, label }) => {
            const opt = document.createElement("option");
            opt.value = abbr;
            opt.textContent = label;
            stateSelect.appendChild(opt);
          });

          drawChart();
        },
        error: () => setStatus("Failed to load overdose CSV file.")
      });
    }

    function drawChart() {
      const variable = variableSelect.value;
      const selectedRegions = new Set(selectedValues(regionSelect));
      const selectedStates = new Set(selectedValues(stateSelect));

      const filtered = store.rows.filter((r) => r.variable === variable);
      if (!filtered.length) {
        setStatus("No records match the selected indicator.");
        Plotly.newPlot("chart", [], { margin: { l: 40, r: 20, t: 30, b: 40 } }, { responsive: true, displayModeBar: false });
        return;
      }

      const byState = new Map();
      for (const row of filtered) {
        if (!byState.has(row.stateAbbr)) byState.set(row.stateAbbr, []);
        byState.get(row.stateAbbr).push(row);
      }

      const highlightedByRegion = new Set();
      selectedRegions.forEach((region) => {
        (REGION_TO_STATES[region] || []).forEach((abbr) => highlightedByRegion.add(abbr));
      });

      const highlightSet = new Set([...highlightedByRegion, ...selectedStates]);

      const traces = [...byState.keys()]
        .sort((a, b) => {
          const aName = store.stateNameByAbbr.get(a) || a;
          const bName = store.stateNameByAbbr.get(b) || b;
          return aName.localeCompare(bName);
        })
        .map((abbr) => {
          const rows = byState.get(abbr).slice().sort((a, b) => a.date - b.date);
          const region = STATE_TO_REGION[abbr] || "Other";
          const stateName = store.stateNameByAbbr.get(abbr) || abbr;
          const highlighted = highlightSet.has(abbr);

          const explicitState = selectedStates.has(abbr);
          const lineWidth = explicitState ? 3.6 : highlighted ? 2.6 : 1.1;
          const lineColor = highlighted ? (REGION_COLORS[region] || "#1d4ed8") : "#9aa3af";
          const opacity = highlighted ? 0.95 : 0.22;

          return {
            type: "scatter",
            mode: "lines",
            x: rows.map((r) => r.date),
            y: rows.map((r) => r.count),
            name: `${stateName} (${abbr})`,
            showlegend: highlighted,
            opacity,
            line: {
              color: lineColor,
              width: lineWidth
            },
            hovertemplate:
              "<b>%{fullData.name}</b><br>" +
              "Month: %{x|%b %Y}<br>" +
              "Deaths: %{y:,.0f}<br>" +
              `Region: ${region}<extra></extra>`
          };
        });

      const highlightedCount = highlightSet.size;
      const totalStates = traces.length;

      setStatus(
        highlightedCount
          ? `Showing ${totalStates} states. Highlighted ${highlightedCount} state lines.`
          : `Showing ${totalStates} states. No highlights selected.`
      );

      Plotly.newPlot(
        "chart",
        traces,
        {
          title: {
            text: `Monthly overdose deaths by state: ${variable}`,
            font: { size: 18 }
          },
          xaxis: {
            title: "Month",
            tickformat: "%Y-%m",
            showgrid: true,
            gridcolor: "#e5e7eb"
          },
          yaxis: {
            title: "Deaths (estimated monthly count)",
            rangemode: "tozero",
            showgrid: true,
            gridcolor: "#e5e7eb"
          },
          legend: {
            title: { text: "Highlighted states" },
            orientation: "h",
            x: 0,
            y: -0.2
          },
          hovermode: "x unified",
          margin: { l: 60, r: 20, t: 65, b: 110 },
          paper_bgcolor: "#ffffff",
          plot_bgcolor: "#ffffff"
        },
        { responsive: true, displaylogo: false }
      );
    }

    variableSelect.addEventListener("change", drawChart);
    regionSelect.addEventListener("change", drawChart);
    stateSelect.addEventListener("change", drawChart);

    document.getElementById("clearHighlightsBtn").addEventListener("click", () => {
      [...regionSelect.options].forEach((opt) => { opt.selected = false; });
      [...stateSelect.options].forEach((opt) => { opt.selected = false; });
      drawChart();
    });

    document.getElementById("highlightAllBtn").addEventListener("click", () => {
      [...stateSelect.options].forEach((opt) => { opt.selected = true; });
      drawChart();
    });

    loadData();
  </script>
</body>
</html>
